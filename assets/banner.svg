<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Evolutionary Prisoner's Dilemma Simulator</title>
  <desc id="desc">A refined visualization of payoff matrix choices, competing strategies, and cooperation evolving over generations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f24"/>
      <stop offset="52%" stop-color="#18333a"/>
      <stop offset="100%" stop-color="#263f35"/>
    </linearGradient>
    <linearGradient id="curveCooperate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#75d6b0"/>
      <stop offset="100%" stop-color="#d9f6a5"/>
    </linearGradient>
    <linearGradient id="curveDefect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#f7c66a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#061014" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#background)"/>
  <path d="M0 292 C142 244 239 311 397 260 C565 205 649 236 816 157 C964 86 1095 111 1200 59 L1200 360 L0 360 Z" fill="#071417" opacity="0.35"/>

  <g opacity="0.18" stroke="#d9f6ee" stroke-width="1">
    <path d="M80 70 H1120"/>
    <path d="M80 130 H1120"/>
    <path d="M80 190 H1120"/>
    <path d="M80 250 H1120"/>
    <path d="M170 44 V304"/>
    <path d="M350 44 V304"/>
    <path d="M530 44 V304"/>
    <path d="M710 44 V304"/>
    <path d="M890 44 V304"/>
    <path d="M1070 44 V304"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="82" y="78" width="330" height="205" rx="8" fill="#f7fbf6"/>
    <text x="247" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17333a">Payoff Matrix</text>
    <rect x="132" y="135" width="103" height="58" rx="6" fill="#e8f5ec"/>
    <rect x="249" y="135" width="103" height="58" rx="6" fill="#fff0df"/>
    <rect x="132" y="207" width="103" height="58" rx="6" fill="#fff0df"/>
    <rect x="249" y="207" width="103" height="58" rx="6" fill="#eaf0f1"/>
    <text x="183" y="169" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#26735f">R=3</text>
    <text x="300" y="169" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#c65a38">S=0</text>
    <text x="183" y="241" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#c65a38">T=5</text>
    <text x="300" y="241" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#49626a">P=1</text>
    <text x="90" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#17333a">C</text>
    <text x="90" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#17333a">D</text>
    <text x="176" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#17333a">C</text>
    <text x="293" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#17333a">D</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 250 C532 215 575 210 635 185 C714 152 758 98 838 83" stroke="url(#curveCooperate)" stroke-width="6"/>
    <path d="M470 136 C535 94 598 99 664 126 C734 153 780 214 852 235" stroke="url(#curveDefect)" stroke-width="5"/>
    <path d="M470 211 C548 187 604 236 674 206 C740 178 792 172 852 151" stroke="#8fb8ff" stroke-width="4" opacity="0.82"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="470" cy="250" r="8" fill="#75d6b0"/>
    <circle cx="635" cy="185" r="8" fill="#75d6b0"/>
    <circle cx="838" cy="83" r="8" fill="#d9f6a5"/>
    <circle cx="470" cy="136" r="7" fill="#e17055"/>
    <circle cx="664" cy="126" r="7" fill="#f7c66a"/>
    <circle cx="852" cy="235" r="7" fill="#f7c66a"/>
    <text x="470" y="288" text-anchor="middle" font-size="15" fill="#d9f6ee">gen 0</text>
    <text x="666" y="288" text-anchor="middle" font-size="15" fill="#d9f6ee">selection</text>
    <text x="852" y="288" text-anchor="middle" font-size="15" fill="#d9f6ee">gen 100</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="810" y="112" font-size="34" font-weight="750" fill="#f7fbf6">Evo PD Simulator</text>
    <text x="812" y="154" font-size="19" fill="#cceee4">cooperation vs defection</text>
    <text x="812" y="184" font-size="17" fill="#cceee4">strategy selection over generations</text>
    <rect x="812" y="222" width="70" height="32" rx="6" fill="#75d6b0"/>
    <rect x="894" y="222" width="70" height="32" rx="6" fill="#e17055"/>
    <rect x="976" y="222" width="70" height="32" rx="6" fill="#8fb8ff"/>
    <text x="847" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#10282c">TFT</text>
    <text x="929" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#10282c">DEF</text>
    <text x="1011" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#10282c">PAV</text>
  </g>
</svg>
