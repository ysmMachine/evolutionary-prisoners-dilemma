<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Evolutionary Prisoner's Dilemma Simulator</title>
  <desc id="desc">A clean banner with a payoff matrix and a simple strategy evolution chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14342f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#030712" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="80" y="112" font-size="52" font-weight="760" fill="#f8fafc">Evo PD</text>
    <text x="82" y="158" font-size="25" font-weight="650" fill="#a7f3d0">Cooperate or defect?</text>
    <text x="82" y="198" font-size="18" fill="#cbd5e1">A C++ simulation of strategy</text>
    <text x="82" y="224" font-size="18" fill="#cbd5e1">selection across generations</text>
    <rect x="82" y="258" width="120" height="36" rx="6" fill="#22c55e"/>
    <text x="142" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#052e16">C++17</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="408" y="58" width="300" height="244" rx="10" fill="#f8fafc"/>
    <text x="558" y="93" text-anchor="middle" font-size="21" font-weight="750" fill="#0f172a">Payoff Matrix</text>
    <text x="558" y="121" text-anchor="middle" font-size="13" fill="#64748b">you, opponent</text>

    <line x1="470" y1="142" x2="670" y2="142" stroke="#94a3b8" stroke-width="2"/>
    <line x1="470" y1="142" x2="470" y2="268" stroke="#94a3b8" stroke-width="2"/>
    <line x1="570" y1="142" x2="570" y2="268" stroke="#94a3b8" stroke-width="2"/>
    <line x1="670" y1="142" x2="670" y2="268" stroke="#94a3b8" stroke-width="2"/>
    <line x1="470" y1="205" x2="670" y2="205" stroke="#94a3b8" stroke-width="2"/>
    <line x1="470" y1="268" x2="670" y2="268" stroke="#94a3b8" stroke-width="2"/>

    <text x="520" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">C</text>
    <text x="620" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">D</text>
    <text x="450" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">C</text>
    <text x="450" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">D</text>

    <rect x="478" y="150" width="84" height="47" rx="6" fill="#dcfce7"/>
    <rect x="578" y="150" width="84" height="47" rx="6" fill="#fee2e2"/>
    <rect x="478" y="213" width="84" height="47" rx="6" fill="#ffedd5"/>
    <rect x="578" y="213" width="84" height="47" rx="6" fill="#e2e8f0"/>

    <text x="520" y="181" text-anchor="middle" font-size="22" font-weight="750" fill="#15803d">3,3</text>
    <text x="620" y="181" text-anchor="middle" font-size="22" font-weight="750" fill="#dc2626">0,5</text>
    <text x="520" y="244" text-anchor="middle" font-size="22" font-weight="750" fill="#ea580c">5,0</text>
    <text x="620" y="244" text-anchor="middle" font-size="22" font-weight="750" fill="#475569">1,1</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="770" y="58" width="350" height="244" rx="10" fill="#f8fafc"/>
    <text x="945" y="93" text-anchor="middle" font-size="21" font-weight="750" fill="#0f172a">Strategy Evolution</text>

    <line x1="825" y1="245" x2="1045" y2="245" stroke="#64748b" stroke-width="2"/>
    <line x1="825" y1="126" x2="825" y2="245" stroke="#64748b" stroke-width="2"/>
    <text x="825" y="268" text-anchor="middle" font-size="12" fill="#64748b">0</text>
    <text x="1045" y="268" text-anchor="middle" font-size="12" fill="#64748b">100</text>

    <polyline points="825,218 870,202 915,172 960,143 1005,126 1045,118" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="825,145 870,157 915,181 960,207 1005,225 1045,235" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="825,196 870,184 915,190 960,173 1005,168 1045,154" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="1045" cy="118" r="5" fill="#16a34a"/>
    <circle cx="1045" cy="235" r="5" fill="#dc2626"/>
    <circle cx="1045" cy="154" r="5" fill="#2563eb"/>

    <rect x="842" y="112" width="76" height="26" rx="5" fill="#dcfce7"/>
    <text x="880" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">TitForTat</text>
    <rect x="842" y="145" width="76" height="26" rx="5" fill="#dbeafe"/>
    <text x="880" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Pavlov</text>
    <rect x="842" y="178" width="76" height="26" rx="5" fill="#fee2e2"/>
    <text x="880" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Defect</text>
  </g>
</svg>
